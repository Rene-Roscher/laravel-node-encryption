name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Node ${{ matrix.node }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [16, 18, 20]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm test

  bidirectional-compatibility:
    name: Laravel ${{ matrix.laravel }} ⟷ Node.js
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Laravel 8 (EOL Jan 2023) and Laravel 9 (EOL Feb 2024) have been removed.
        # Supported versions: Laravel 10+ (currently maintained).
        laravel: [10, 11, 12, 13]

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: openssl, mbstring
        tools: composer

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci

    - name: Install real illuminate/encryption ^${{ matrix.laravel }}
      run: composer require "illuminate/encryption:^${{ matrix.laravel }}.0" --no-interaction --no-progress

    # Laravel -> Node: PHP generates fresh vectors (all four ciphers), Jest decrypts them.
    - name: Generate Laravel vectors
      run: php scripts/generate_vectors.php
    - name: Node decrypts Laravel vectors
      run: npx jest test/laravel-vectors.test.js

    # Node -> Laravel: Node encrypts, PHP decrypts and asserts.
    - name: Laravel decrypts Node vectors
      run: node scripts/genvectors.js | php scripts/verify_node_vectors.php

    # Malformed input: Node and Laravel must accept and reject exactly the same payloads.
    - name: Node and Laravel judge mutated payloads alike
      run: node scripts/mutations.js | php scripts/verify_mutations.php
